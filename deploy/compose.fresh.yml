# DARMA new-VPS deployment. This project owns ports 80/443 on an otherwise empty host.
services:
  web:
    container_name: darmawear-store-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env.preview
      - ../.env.store
    environment:
      NEXT_PUBLIC_SITE_LIVE: "false"
    restart: unless-stopped
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
  cms-db:
    container_name: darmawear-cms-db
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.env.cms
    volumes:
      - cms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darma_cms -d darma_cms"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
  cms:
    container_name: darmawear-admin
    image: directus/directus:12.6.1
    env_file:
      - ../.env.cms
    restart: unless-stopped
    expose:
      - "8055"
    depends_on:
      cms-db:
        condition: service_healthy
    volumes:
      - cms_uploads:/directus/uploads
      - cms_extensions:/directus/extensions
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
  caddy:
    container_name: darmawear-store-caddy
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.fresh:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
  cms_db_data:
  cms_uploads:
  cms_extensions:
