name: DARMA SEO governance
on:
  push:
  pull_request:
jobs:
  seo-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate DARMA SEO constitution and production scaffold
        run: node scripts/check-seo-governance.mjs
