name: DARMA SEO and build quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo-governance:
    name: seo-governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_LIVE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install declared dependencies
        run: npm install --no-audit --no-fund
      - name: Strict SEO governance and route contract
        run: npm run seo:static
      - name: Verify premature public launch is rejected
        run: |
          if NEXT_PUBLIC_SITE_LIVE=true node scripts/release-guard.mjs; then
            echo "::error::Unsafe public deployment was not blocked"
            exit 1
          fi
      - name: Deployment installer shell syntax
        run: bash -n deploy/install-preview.sh
      - name: Fresh VPS installation syntax
        run: |
          bash -n deploy/install-fresh.sh
          test -s deploy/compose.fresh.yml
          test -s deploy/Caddyfile.fresh
          printf 'NEXT_PUBLIC_SITE_LIVE=false\n' > .env.preview
          printf 'DARMA_CMS_URL=http://cms:8055\nDARMA_CMS_TOKEN=test-token\n' > .env.store
          cat > .env.cms <<'TEST_SECRETS'
          SECRET=aabbccddeeff0011223344556677889900112233445566778899aabbccddeeff00
          ADMIN_EMAIL=studio-test@example.com
          ADMIN_PASSWORD=CI_Example_Test_Password_2026
          ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DB_CLIENT=pg
          DB_HOST=cms-db
          DB_PORT=5432
          DB_DATABASE=darma_cms
          DB_USER=darma_cms
          DB_PASSWORD=ci_test_database_password
          POSTGRES_DB=darma_cms
          POSTGRES_USER=darma_cms
          POSTGRES_PASSWORD=ci_test_database_password
          PUBLIC_URL=https://admin.darmawear.ir
          TEST_SECRETS
          node --check cms/bootstrap.mjs
          docker compose -p darmawear-ci -f deploy/compose.fresh.yml config -q
          rm -f .env.preview .env.cms .env.store
      - name: TypeScript safety
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Server-rendered SEO regression check
        run: npm run seo:smoke
      - name: Docker build parity with actual VPS deployment
        run: docker build --progress=plain --file deploy/Dockerfile --tag darmawear-ci:${{ github.sha }} .

      - name: Live Directus schema and Caddy configuration integration test
        run: |
          printf 'NEXT_PUBLIC_SITE_LIVE=false\n' > .env.preview
          printf 'DARMA_CMS_URL=http://cms:8055\nDARMA_CMS_TOKEN=test-token\n' > .env.store
          cat > .env.cms <<'TEST_SECRETS'
          SECRET=aabbccddeeff0011223344556677889900112233445566778899aabbccddeeff00
          ADMIN_EMAIL=studio-test@example.com
          ADMIN_PASSWORD=CI_Example_Test_Password_2026
          ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DB_CLIENT=pg
          DB_HOST=cms-db
          DB_PORT=5432
          DB_DATABASE=darma_cms
          DB_USER=darma_cms
          DB_PASSWORD=ci_test_database_password
          POSTGRES_DB=darma_cms
          POSTGRES_USER=darma_cms
          POSTGRES_PASSWORD=ci_test_database_password
          PUBLIC_URL=https://admin.darmawear.ir
          TEST_SECRETS
          docker compose -p darmawear-ci -f deploy/compose.fresh.yml run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose -p darmawear-ci -f deploy/compose.fresh.yml up -d cms-db cms
          ready=0
          for i in $(seq 1 75); do
            if docker exec darmawear-admin node -e "fetch('http://127.0.0.1:8055/server/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then ready=1; break; fi
            sleep 3
          done
          test "$ready" -eq 1 || { docker logs darmawear-admin --tail 80; exit 1; }
          docker exec -i darmawear-admin node --input-type=module - < cms/bootstrap.mjs
          docker exec -i darmawear-admin node --input-type=module - < cms/bootstrap.mjs
          docker exec darmawear-admin node -e "fetch('http://127.0.0.1:8055/items/darma_content',{headers:{Authorization:'Bearer '+process.env.ADMIN_TOKEN}}).then(r=>r.json()).then(j=>{const v=j.data;process.exit(v && (!Array.isArray(v) || v.length>0)?0:1)}).catch(()=>process.exit(1))"
          docker compose -p darmawear-ci -f deploy/compose.fresh.yml down -v
          rm -f .env.cms .env.store .env.preview
