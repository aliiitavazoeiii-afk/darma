name: DARMA SEO and build quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo-governance:
    name: seo-governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_LIVE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install declared dependencies
        run: npm install --no-audit --no-fund
      - name: Strict SEO governance and route contract
        run: npm run seo:static
      - name: Verify premature public launch is rejected
        run: |
          if NEXT_PUBLIC_SITE_LIVE=true node scripts/release-guard.mjs; then
            echo "::error::Unsafe public deployment was not blocked"
            exit 1
          fi
      - name: Deployment installer shell syntax
        run: bash -n deploy/install-preview.sh
      - name: Fresh VPS installation syntax
        run: |
          bash -n deploy/install-fresh.sh
          test -s deploy/compose.fresh.yml
          test -s deploy/Caddyfile.fresh
          printf 'NEXT_PUBLIC_SITE_LIVE=false\n' > .env.preview
          docker compose -p darmawear-store -f deploy/compose.fresh.yml config -q
          rm -f .env.preview
      - name: TypeScript safety
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Server-rendered SEO regression check
        run: npm run seo:smoke
      - name: Docker build parity with actual VPS deployment
        run: docker build --progress=plain --file deploy/Dockerfile --tag darmawear-ci:${{ github.sha }} .
